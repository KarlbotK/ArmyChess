server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: armychess-server
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

armychess:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4173,http://127.0.0.1:4173}
  data-dir: ${ARMYCHESS_DATA_DIR:./data/rooms}
