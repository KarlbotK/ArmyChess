services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: http://localhost:8088
      ARMYCHESS_DATA_DIR: /app/data/rooms
    volumes:
      - armychess-data:/app/data

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8088:80"

volumes:
  armychess-data:
